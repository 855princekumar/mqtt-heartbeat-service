<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat lifecycle and node states</title>
  <desc id="desc">The agent connects over TLS and registers a last will for its session, sends birth, then a heartbeat every ten seconds, and reconnects with a new topic and will each ten-minute window. If its connection drops, the broker publishes the will and the receiver marks the node offline. If the broker or internet path is down, nothing arrives and after 35 seconds the node shows as silent until heartbeats resume.</desc>
  <defs>
    <style>
      .tt{font-size:15px;font-weight:700;fill:#0f172a}
      .t{font-size:12.5px;font-weight:700;fill:#0f172a}
      .lbl{font-size:11px;fill:#475569}
      .mut{font-size:11px;fill:#64748b}
      .st{font-size:11.5px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <text x="30" y="34" class="tt" font-size="18">Heartbeat lifecycle and node states</text>
  <text x="30" y="54" class="mut">What the agent sends over time, and what the receiver (SenseHive) shows.</text>

  <!-- Scenario 1 -->
  <text x="30" y="88" class="t">1  Normal life, then the node drops</text>
  <line x1="60" y1="160" x2="950" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="80" cy="160" r="7" fill="#1a56db"/>
  <text x="80" y="118" class="lbl" text-anchor="middle">connect (TLS)</text>
  <text x="80" y="133" class="lbl" text-anchor="middle">+ last will</text>
  <circle cx="160" cy="160" r="7" fill="#059669"/>
  <text x="160" y="133" class="t" text-anchor="middle" style="fill:#047857">birth</text>
  <g fill="#059669"><circle cx="220" cy="160" r="4"/><circle cx="270" cy="160" r="4"/><circle cx="320" cy="160" r="4"/><circle cx="370" cy="160" r="4"/></g>
  <text x="295" y="133" class="lbl" text-anchor="middle">hb every 10 s</text>

  <rect x="430" y="150" width="20" height="20" rx="4" fill="#7c3aed"/>
  <text x="440" y="118" class="lbl" text-anchor="middle">new 10-min window:</text>
  <text x="440" y="133" class="lbl" text-anchor="middle">new topic, new will</text>
  <circle cx="500" cy="160" r="7" fill="#059669"/>
  <text x="500" y="186" class="lbl" text-anchor="middle">birth</text>
  <g fill="#059669"><circle cx="560" cy="160" r="4"/><circle cx="610" cy="160" r="4"/><circle cx="660" cy="160" r="4"/></g>

  <g stroke="#dc2626" stroke-width="3"><line x1="722" y1="152" x2="738" y2="168"/><line x1="738" y1="152" x2="722" y2="168"/></g>
  <text x="730" y="118" class="lbl" text-anchor="middle">power or network</text>
  <text x="730" y="133" class="lbl" text-anchor="middle">lost on the node</text>
  <circle cx="840" cy="160" r="7" fill="#dc2626"/>
  <text x="840" y="118" class="lbl" text-anchor="middle">broker publishes</text>
  <text x="840" y="133" class="lbl" text-anchor="middle">the will (session)</text>

  <rect x="160" y="200" width="680" height="26" rx="6" fill="#059669"/>
  <text x="500" y="217" class="st" text-anchor="middle">online</text>
  <rect x="840" y="200" width="110" height="26" rx="6" fill="#dc2626"/>
  <text x="895" y="217" class="st" text-anchor="middle">offline</text>
  <text x="60" y="217" class="mut">receiver shows</text>

  <!-- Scenario 2 -->
  <text x="30" y="268" class="t">2  The broker or the internet path is down (the node is fine)</text>
  <line x1="60" y1="330" x2="950" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#059669"><circle cx="100" cy="330" r="4"/><circle cx="150" cy="330" r="4"/><circle cx="200" cy="330" r="4"/><circle cx="250" cy="330" r="4"/></g>
  <text x="175" y="306" class="lbl" text-anchor="middle">hb arriving</text>
  <line x1="290" y1="330" x2="640" y2="330" stroke="#fcd34d" stroke-width="6" stroke-dasharray="2 8"/>
  <text x="465" y="300" class="lbl" text-anchor="middle">nothing arrives: no heartbeat and no will</text>
  <text x="465" y="314" class="lbl" text-anchor="middle">(the agent keeps retrying, 2 s up to 60 s)</text>
  <g fill="#059669"><circle cx="680" cy="330" r="4"/><circle cx="730" cy="330" r="4"/><circle cx="780" cy="330" r="4"/><circle cx="830" cy="330" r="4"/><circle cx="880" cy="330" r="4"/></g>
  <text x="780" y="306" class="lbl" text-anchor="middle">path back: hb again</text>

  <rect x="100" y="360" width="185" height="26" rx="6" fill="#059669"/>
  <text x="192" y="377" class="st" text-anchor="middle">online</text>
  <rect x="285" y="360" width="395" height="26" rx="6" fill="#d97706"/>
  <text x="482" y="377" class="st" text-anchor="middle">silent (after 35 s): not counted as the node's fault</text>
  <rect x="680" y="360" width="270" height="26" rx="6" fill="#059669"/>
  <text x="815" y="377" class="st" text-anchor="middle">online</text>
  <text x="60" y="404" class="mut">An old will from an earlier session is ignored, so a reconnecting node is never marked offline by mistake.</text>
</svg>
